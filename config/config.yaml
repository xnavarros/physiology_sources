# config/config.yaml

subjects:
  - BJ25
  - JS08
  - LP26
  - MC05
  - MN23
  - OL04
  - SB27
  - TH24
  - VA14
  - VS06

paths:
  base_data_dir: "data/raw"
  preprocessed_data_dir: "data/preprocessed"
  preprocessed_slow_potentials_dir: "data/preprocessed_slow_potentials"
  results_dir: "results" # General output directory for analysis scripts
  source_estimates_dir: "data/source_estimates"
  statistics_dir: "data/statistical_results"
  roi_dir: "data/roi_analysis"
  brain_plots_dir: "figures/brain_plots"

# --- Parameters for the preprocessing pipelines ---
preprocessing_params:
  apply_notch: false
  apply_ica: true
  n_ica_components: 20 # Can be an int (number) or float (variance explained, e.g., 0.99)
  tmin: -1.5
  tmax: 0.5
  apply_baseline_after_ica: true
  baseline_timing: [-1.5, -1.25]
  
  # Parameters for slow potentials pipeline
  l_freq_slow: 0.1
  h_freq_slow: 40.0
  tmin_slow: -2.5
  tmax_slow: 0.5
  baseline_timing_slow: [-2.5, -2.0]
  # This is the marker used in the slow potential script
  inspiration_marker: 'Response/R128'

# --- Parameters for AutoReject ---
autoreject_params:
  # n_interpolate is an array of values to test for the number of channels to interpolate.
  n_interpolate: [1, 2, 3]
  
  # The consensus percentage determines how many cross-validation folds must agree
  # on a rejection threshold.
  consensus: [0.9, 0.8, 0.7]

# --- Original params, now for post-preprocessing steps (e.g., source estimation) ---
params:
  # Frequency band for filtering AFTER preprocessing, before source estimation
  freq1: 20
  freq2: 30
  # Time windows for source estimation
  time_intervals:
    - [-1.25, -1]
    - [-1, -0.75]
    - [-0.75, -0.5]
    - [-0.5, -0.25]
    - [-0.25, 0]
    - [0, 0.25]
    - [0.25, 0.5]
  # Custom flag, likely for source estimation script
  apply_td_baseline: true

# --- Parameters for statistical analysis ---
group_stats:
  n_permutations: 500
  threshold: 1.25
  n_epochs: 10
  significance_level: 0.05